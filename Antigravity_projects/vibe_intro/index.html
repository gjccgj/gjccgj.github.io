<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101c">
  <title>◯</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky" aria-label="Interactive night sky. Click to awaken stars. Drag to cast meteors."></canvas>
  <button id="moon" aria-label="Move the moon" tabindex="0">
    <span class="moon-surface" aria-hidden="true"></span>
    <span class="moon-shadow" aria-hidden="true"></span>
  </button>
  <div id="constellation-label" aria-live="polite"></div>
  <form id="star-name-panel" hidden>
    <input id="star-name-input" maxlength="24" autocomplete="off" aria-label="Star name">
    <button type="submit" aria-label="Save star name"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 12 4 4 8-9"/></svg></button>
    <button id="delete-star-name" type="button" aria-label="Delete star name" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M9 7V4h6v3m2 0-1 13H8L7 7m3 4v5m4-5v5"/></svg></button>
    <button id="cancel-star-name" type="button" aria-label="Cancel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 7 10 10M17 7 7 17"/></svg></button>
  </form>
  <nav aria-label="Sky controls">
    <button id="burst" aria-label="Release meteors"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m4 4 6 6m-7 1 5 5m3-13 5 5"/><path d="m15 10 1.7 3.3L20 15l-3.3 1.7L15 20l-1.7-3.3L10 15l3.3-1.7Z"/></svg></button>
    <button id="name-star" aria-label="Name a star" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 1.7 3.8L15 7.3l-3.2 2.9.9 4.2L9 12.2l-3.7 2.2.9-4.2L3 7.3l4.3-.5Z"/><path d="m14 17 5-5 2 2-5 5-3 1Z"/></svg></button>
    <button id="sound" aria-label="Toggle ambient sound" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10 7-4 3H3v4h3l4 3Z"/><path class="waves" d="M14 8q6 4 0 8m3-11q10 7 0 14"/><path class="mute" d="m15 10 5 5m0-5-5 5"/></svg></button>
    <button id="fullscreen" aria-label="Toggle fullscreen"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4H4v4m12-4h4v4M4 16v4h4m12-4v4h-4"/></svg></button>
  </nav>
  <script src="sketch.js"></script>
</body>
</html>
