<script>
    const book = document.getElementById('book-3d');
    let rotX = 0, rotY = 0, scale = 1;
    let isDragging = false;


    window.addEventListener('mousedown', (e) => {
        isDragging = true;
        book.classList.add('dragging');
    });
// Update the variables while dragging
window.addEventListener('mousemove', (e) => {
    if (isDragging) {
        rotY += e.movementX * 0.5;
        rotX -= e.movementY * 0.5;
        // Keep the transform applied
        book.style.transform = `rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${scale})`;
    }
});

// When unclicking, do NOT reset the transform to ''
window.addEventListener('mouseup', () => {
    isDragging = false;
    book.classList.remove('dragging');
    
    // Instead of clearing the transform, we leave it exactly where it is.
    // The CSS animation will now start spinning from this new angle!
});

    window.addEventListener('wheel', (e) => {
        e.preventDefault();
        scale = Math.min(Math.max(0.5, scale + e.deltaY * -0.001), 2.5);

    }, { passive: false });

    // This runs the moment the page opens
    window.onload = function() {
        // 1. Check the URL for the 'section' (e.g., ?section=process)
        const urlParams = new URLSearchParams(window.location.search);
        const sectionToOpen = urlParams.get('section');

        // 2. If a section was specified, open it!
        if (sectionToOpen) {
            showSection(sectionToOpen);
        }
    };

    // Keep your existing showSection function, but make sure 
    // it also handles the highlighting of the TOC items.
    function showSection(sectionId) {
        // Hide all sections
        document.querySelectorAll('.content-section').forEach(s => s.classList.remove('active'));
        // Remove 'active' from all TOC items
        document.querySelectorAll('.toc-item').forEach(i => i.classList.remove('active'));

        // Show the specific section
        const targetSection = document.getElementById(sectionId);
        if (targetSection) {
            targetSection.classList.add('active');
        }

        // Find the TOC item that belongs to this ID and make it white
        const activeItem = document.querySelector(`[onclick="showSection('${sectionId}')"]`);
        if (activeItem) {
            activeItem.classList.add('active');
        }

        let isPaused = false;

const bookElement = document.getElementById('book-3d');

bookElement.addEventListener('mouseenter', () => { isPaused = true; });
bookElement.addEventListener('mouseleave', () => { isPaused = false; });

function animate() {
    if (!isPaused) {
        // ... your existing rotation code goes here ...
    }
    requestAnimationFrame(animate);
}
    }
</script>
